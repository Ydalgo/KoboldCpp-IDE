<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agent Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1e1e1e; color: #e0e0e0;
            display: flex; height: 100vh;
        }
        .sidebar {
            width: 260px; background: #252526;
            border-right: 1px solid #333;
            display: flex; flex-direction: column;
        }
        .sidebar h1 {
            padding: 16px; font-size: 14px; border-bottom: 1px solid #333;
            font-weight: 500; color: #4ec9b0;
        }
        .sessions { flex: 1; overflow-y: auto; padding: 8px; }
        .session {
            padding: 8px 10px; border-radius: 4px; cursor: pointer;
            font-size: 13px; margin-bottom: 4px;
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        .session:hover { background: #2a2d2e; }
        .session.active { background: #094771; }
        .session .preview {
            overflow: hidden; text-overflow: ellipsis;
            flex: 1; line-height: 1.3;
        }
        .session .del {
            color: #888; margin-left: 8px; font-size: 16px; padding: 0 4px;
        }
        .session .del:hover { color: #f48771; }
        .new-session {
            margin: 8px; padding: 8px; background: #0e639c; color: white;
            border: none; border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .new-session:hover { background: #1177bb; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .header {
            padding: 12px 20px; background: #2d2d30;
            border-bottom: 1px solid #333;
            display: flex; align-items: center; gap: 12px; font-size: 13px;
        }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
        .status-dot.ok { background: #4ec9b0; }
        .status-dot.error { background: #f48771; }
        .header .model { color: #888; margin-left: auto; }
        .header .session-info { display: flex; flex-direction: column; gap: 2px; }
        .header .session-title { font-weight: 500; }
        .header .session-workspace { font-size: 11px; color: #888; }
        .header .btn-config {
            background: #444; color: #ddd; border: none; border-radius: 4px;
            padding: 6px 10px; cursor: pointer; font-size: 12px;
        }
        .header .btn-config:hover { background: #555; }
        .messages {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .msg {
            max-width: 80%; padding: 10px 14px; border-radius: 8px;
            white-space: pre-wrap; word-wrap: break-word;
            font-size: 14px; line-height: 1.5;
        }
        .msg.user { background: #094771; align-self: flex-end; }
        .msg.assistant { background: #2a2d2e; align-self: flex-start; }
        .msg.error { background: #5a1d1d; align-self: center; font-size: 13px; }
        .msg.tool-call {
            background: #2d2a10; border-left: 3px solid #cca700;
            align-self: flex-start; font-size: 12px; max-width: 90%;
            padding: 6px 10px; font-family: ui-monospace, monospace;
        }
        .msg.tool-call.tool-ok { border-left-color: #4ec9b0; }
        .msg.tool-call.tool-error { border-left-color: #f48771; }
        .msg.tool-call .args { color: #888; margin-left: 8px; }
        .msg.tool-call .tool-result { margin-left: 8px; }
        .input-area {
            padding: 16px 20px; background: #2d2d30;
            border-top: 1px solid #333; display: flex; gap: 8px;
        }
        .input-area textarea {
            flex: 1; background: #1e1e1e; color: #e0e0e0;
            border: 1px solid #444; border-radius: 6px;
            padding: 10px 12px; font-family: inherit; font-size: 14px;
            resize: none; height: 60px;
        }
        .input-area textarea:focus { outline: none; border-color: #0e639c; }
        .input-area button {
            padding: 0 20px; background: #0e639c; color: white;
            border: none; border-radius: 6px; cursor: pointer;
            font-size: 14px; font-weight: 500;
        }
        .input-area button:hover { background: #1177bb; }
        .input-area button:disabled { background: #555; cursor: not-allowed; }
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); align-items: center;
            justify-content: center; z-index: 100;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: #252526; padding: 24px; border-radius: 8px;
            width: 90%; max-width: 700px; max-height: 90vh; overflow-y: auto;
            border: 1px solid #444;
        }
        .modal-content h2 {
            margin-bottom: 16px; font-size: 16px; color: #4ec9b0;
        }
        .modal-content label {
            display: block; margin-bottom: 4px; font-size: 12px; color: #888;
            margin-top: 12px;
        }
        .modal-content input, .modal-content textarea {
            width: 100%; padding: 8px 10px; background: #1e1e1e;
            color: #e0e0e0; border: 1px solid #444; border-radius: 4px;
            font-size: 13px; font-family: inherit;
        }
        .modal-content textarea { min-height: 200px; resize: vertical; }
        .modal-content button {
            padding: 8px 16px; background: #0e639c; color: white;
            border: none; border-radius: 4px; cursor: pointer; margin-right: 8px;
            margin-top: 16px;
        }
        .modal-content button.secondary { background: #555; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h1>🧠 Agent Dashboard</h1>
        <button class="new-session" onclick="newSession()">+ Nueva sesión</button>
        <div class="sessions" id="sessions"></div>
        <button class="new-session" style="background:#444;" onclick="openConfig()">⚙ Configurar LLM</button>
    </aside>

    <main class="main">
        <div class="header">
            <div class="status-dot" id="status-dot"></div>
            <div class="session-info">
                <span class="session-title" id="session-title">—</span>
                <span class="session-workspace" id="session-workspace"></span>
            </div>
            <button class="btn-config" onclick="openSessionConfig()">📁 Workspace + Prompt</button>
            <span class="status-text" id="status-text" style="font-size:11px;color:#888"></span>
            <span class="model" id="status-model" style="font-size:11px"></span>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <textarea id="input" placeholder="Escribe un mensaje… (Enter para enviar, Shift+Enter para nueva línea)"></textarea>
            <button id="send" onclick="send()">Enviar</button>
        </div>
    </main>

    <!-- Modal: Configuración LLM -->
    <div class="modal" id="config-modal">
        <div class="modal-content">
            <h2>⚙ Configuración del LLM</h2>
            <label>Base URL</label>
            <input id="cfg-base-url" />
            <label>Modelo</label>
            <input id="cfg-model" />
            <label>API Key</label>
            <input id="cfg-api-key" />
            <label>Temperature</label>
            <input id="cfg-temperature" type="number" step="0.1" min="0" max="2" />
            <label>Max Tokens</label>
            <input id="cfg-max-tokens" type="number" min="1" />
            <button onclick="saveConfig()">Guardar</button>
            <button class="secondary" onclick="closeConfig()">Cancelar</button>
        </div>
    </div>

    <!-- Modal: Workspace + System Prompt -->
    <div class="modal" id="session-modal">
        <div class="modal-content">
            <h2>📁 Workspace y Prompt del sistema</h2>
            <label>Directorio de trabajo (workspace)</label>
            <input id="sess-workspace" placeholder="/home/usuario/proyectos/pnt" />
            <label>System Prompt (prompt madre)</label>
            <textarea id="sess-prompt"></textarea>
            <button onclick="saveSessionConfig()">Guardar</button>
            <button class="secondary" onclick="closeSessionConfig()">Cancelar</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
